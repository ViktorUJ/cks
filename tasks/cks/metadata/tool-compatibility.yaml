schema_version: 1

checked_at: "2026-09-06"

# Значения ниже собраны из фактически закреплённых версий в env.hcl и worker.sh лабораторий
# (labs/110, labs/111) и compatibility note в course/26/ru.md. При обновлении версии
# инструмента в лабе - обновите соответствующую запись здесь и проверьте, что compatibility
# note в затронутых главах курса (26 для Kyverno, 22-23 для gVisor/Kata/Cilium) не устарела.

kubernetes:
  training_core_labs: "1.36"
  training_legacy_labs: "1.28-1.34 (разброс по labs/01-30/*/env.hcl, не единая версия)"
  exam_snapshot: "1.35"

cilium:
  data_plane_helm_version: "1.20.1"
  cli_version: "v0.19.7"
  kubernetes:
    supported:
      - "1.33"
      - "1.34"
      - "1.35"
      - "1.36"
  status: supported
  lab: labs/110
  source: labs/110/env.hcl

kyverno:
  course_version: "1.19.0"
  helm_chart_version: "3.9.0"
  kubernetes:
    officially_tested:
      - "1.33"
      - "1.34"
      - "1.35"
    training_cluster: "1.36"
  status: intentionally_outside_official_matrix
  note: >
    Lab 108 и Lab 111 устанавливают Kyverno через Helm chart 3.9.0, что соответствует
    релизу Kyverno 1.19.0, на training-кластере Kubernetes 1.36. Это forward-looking
    training-комбинация вне официально протестированной support matrix Kyverno 1.19
    (v1.33-v1.35). Её нельзя представлять как officially supported связку. Если для
    конкретного negative test требуется более новый patch внутри ветки 1.19.x, сверяйте
    актуальный fixed release в kyverno/kyverno перед тем, как объявлять его pinned - этот
    файл описывает версию, которую лабы реально устанавливают, а не желаемый минимум.
  source: course/26/ru.md

trivy:
  course_version: "0.74.0"
  verify_before_release: true
  source: labs/111/worker/files/worker.sh

syft:
  course_version: "1.51.0"
  verify_before_release: true
  source: labs/111/worker/files/worker.sh

cosign:
  course_version: "3.1.3"
  verify_before_release: true
  source: labs/111/worker/files/worker.sh

kubelinter:
  course_version: "0.8.3"
  verify_before_release: true
  source: labs/111/worker/files/worker.sh

kubesec:
  course_version: "2.14.0"
  verify_before_release: true
  source: labs/111/worker/files/worker.sh

hadolint:
  course_version: "2.12.0"
  verify_before_release: true
  source: labs/111/worker/files/worker.sh

falco:
  verify_before_release: true
  note: >
    Версия не закреплена единым номером в курсе; глава 29 описывает установку через
    официальный APT/package repository и driver-specific systemd unit вместо конкретного
    pinned релиза. Перед release проверить актуальность package repository instructions
    на falco.org/docs/setup/packages/.

gvisor:
  verify_before_release: true
  note: >
    Глава 22 использует apt package `runsc` или архив `gvisor.tar.zstd` (multi-file layout
    после изменения gVisor в июле 2026). Проверять актуальность layout перед release:
    gvisor.dev/docs/user_guide/install/.

kata_containers:
  install_path: "kata-deploy Helm chart"
  note: >
    Глава 22 рекомендует kata-deploy Helm chart как основной Kubernetes install path;
    runtime-rs shim (например kata-qemu-runtime-rs) - актуальный default вместо
    deprecated Go runtime.
