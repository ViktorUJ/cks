schema_version: 1

checked_at: "2026-09-10"

# The values below are taken from versions actually pinned in env.hcl and the laboratories' worker.sh
# (labs/110, labs/111) and the compatibility note in course/26/ru.md. When updating the
# tool version in a lab, update the corresponding entry here and verify that the compatibility
# note in the affected course chapters (26 for Kyverno, 22-23 for gVisor/Kata/Cilium) is not outdated.

kubernetes:
  training_core_labs: "1.36"
  exam_snapshot: "1.35"

cilium:
  data_plane_helm_version: "1.20.1"
  data_plane_latest_stable_checked: "1.20.1"
  data_plane_latest_checked_at: "2026-09-10"
  cli_version: "v0.19.7"
  cli_latest_stable_checked: "v0.20.0"
  cli_latest_checked_at: "2026-09-11"
  pin_status: intentionally_pinned
  kubernetes:
    supported:
      - "1.33"
      - "1.34"
      - "1.35"
      - "1.36"
  status: supported
  lab: labs/110
  source: labs/110/env.hcl

kyverno:
  course_version: "1.19.0"
  helm_chart_version: "3.9.0"
  latest_stable_checked: "1.19.1"
  latest_checked_at: "2026-09-10"
  pin_status: intentionally_pinned
  kubernetes:
    officially_tested:
      - "1.33"
      - "1.34"
      - "1.35"
    training_cluster: "1.36"
  status: intentionally_outside_official_matrix
  note: >
    Lab 108 and Lab 111 install Kyverno via Helm chart 3.9.0, which corresponds
    to the Kyverno 1.19.0 release, on the Kubernetes 1.36 training cluster. This is a forward-looking
    training combination outside the officially tested Kyverno 1.19 support matrix
    (v1.33-v1.35). It must not be represented as an officially supported combination. If a
    particular negative test requires a newer patch within the 1.19.x branch, check the
    current fixed release in kyverno/kyverno before claiming it is pinned - this
    file describes the version that the labs actually install, not the desired minimum.
  source: course/26/ru.md

trivy:
  course_version: "0.74.0"
  latest_stable_checked: "0.74.0"
  latest_checked_at: "2026-09-10"
  pin_status: intentionally_pinned
  verify_before_release: true
  source: labs/111/worker/files/worker.sh

syft:
