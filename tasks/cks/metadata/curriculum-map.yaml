        relevance: core
        theory: ["course/25/ru.md"]
        labs: ["labs/111"]
        mocks: ["mock/02", "mock/03"]
      artifact_signing_verification:
        relevance: core
        theory: ["course/26/ru.md"]
        labs: ["labs/108", "labs/111"]
        mocks: []
      static_analysis:
        relevance: core
        theory: ["course/27/ru.md"]
        labs: []
        mocks: []
      image_vulnerability_scanning:
        relevance: core
        theory: ["course/28/ru.md", "course/25/ru.md"]
        labs: ["labs/111"]
        mocks: ["mock/01", "mock/02", "mock/03"]

  monitoring_logging_runtime_security:
    weight: 20
    weight_source: linux_foundation_product_page
    chapters: ["29", "30", "31", "32"]
    competencies:
      behavioral_analytics:
        relevance: core
        theory: ["course/29/ru.md"]
        labs: ["labs/112"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]
      threat_detection:
        relevance: core
        theory: ["course/30/ru.md", "course/29/ru.md"]
        labs: ["labs/112"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]
        note: >
          The official curriculum wording ("Detect threats within physical
          infrastructure, apps, networks, data, users and workloads") explicitly mentions
          physical infrastructure. Chapter 30 (section 30.1a) now provides substantive
          coverage of this layer in the cloud native context, based on the CNCF Cloud Native Security
          Whitepaper: hardware root of trust/TPM, confidential computing (TEE), node
          bootstrapping trust, HSM for critical keys, and secure erasure of physical
          media—with an explicit indication of which mechanisms overlap with
          Kubernetes practice (RuntimeClass for confidential containers, Node
          feature-labels) and which are entirely outside the Kubernetes API and belong to
          the cloud provider/infrastructure team. This does not replace a dedicated
          ISO 27001/SOC 2-style physical-security program, but it gives the student a
          correct threat classification and terminology rather than merely formally
          mentioning the gap. Manually verified against the official PDF
          curriculum (verification 2026-09-07). A comparison with competing courses for this
          specific competency was not conducted with sufficient evidence and is deliberately not
          included in this file—such comparisons belong in a separate audit with a
          recorded source/date, not canonical curriculum metadata.
      attack_phase_investigation:
        relevance: core
        theory: ["course/02/ru.md", "course/30/ru.md"]
        labs: ["labs/112"]
        mocks: []
      immutability:
        relevance: core
        theory: ["course/31/ru.md", "course/18/ru.md"]
        labs: ["labs/112"]
        mocks: []
      audit_logs:
        relevance: core
        theory: ["course/32/ru.md"]
        labs: ["labs/112"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]

foundation:
  # Chapters 01–03 provide the threat-model glossary and Linux mechanisms; they are not tied to a
  # single weighted exam domain, but are prerequisites for all domains above.
  chapters: ["01", "02", "03"]
  relevance: core
  note: >
    Chapter 01 covers the exam format and exam snapshot. Chapter 02 covers the threat model/OWASP Kubernetes
    Top 10 2025 and is also used in attack_phase_investigation (monitoring domain).
    Chapter 03 covers Linux isolation (namespaces, cgroups, capabilities, User Namespaces), a
    prerequisite for apparmor/seccomp (system_hardening) and sandboxed containers
    (minimize_microservice_vulnerabilities).

tactics:
  # Chapter 33 covers exam tactics, permitted documentation, and the final checklist.
  chapters: ["33"]
  relevance: core

coverage_gaps:
  # Known mismatches between the official six-domain model and curriculum-map:
  # populated manually during audits; it is not an automated conclusion.
  - id: no_mock_coverage_several_competencies
    checked_at: "2026-09-07"
    note: >
      Manually verified by line-by-line reading of the README/tests.bats of every mock/01-04 (2026-09-06,
      repeated 2026-09-07): ingress_tls, isolation_multitenancy, pod_to_pod_encryption,
      image_vulnerability_scanning, sbom_cicd_artifact_repos, behavioral_analytics,
      threat_detection, audit_logs, restrict_api_access, upgrade_kubernetes (mock/04 Task 11
      "update cluster"), and admission_policies (mock/01, mock/02, mock/03 Task 17 "Open Policy
      Agent - Blacklist Images") are actually covered by one or more mock/0N—the mocks:
      fields above have been updated with specific lists. The following remain without mock coverage, confirmed
      by the absence of corresponding tasks (not merely "not checked"): node_metadata_endpoints,
      verify_platform_binaries, base_image_minimization, artifact_signing_verification (cosign/
      signature verification—not found in mocks), static_analysis (hadolint/kube-linter/
      kubesec—not found in mocks).

interleaving_bank:
  # Machine-readable bank of questions and tasks tagged by intersecting domains/chapters.
  # Source for future automatic generation of mixed quizzes. Added following feedback about the
  # absence of interleaving across domains (2026-09-06): until then, the course was strictly
  # single-domain within each chapter, with no mixed practice across chapters.
  #
  # kind: flashback_question - 1 question at the end of a chapter's self-check section, referring to
  #                             a non-adjacent domain;
  #       mixed_checkpoint    - a block of 4–5 tasks at the end of the last chapter in a domain,
  #                             with at least one explicitly mixed task;
  #       integration_task    - a task inside an existing lab that requires a technique
  #                             from another domain to complete it.
  questions:
    - id: fb_10_04
      kind: flashback_question
      domains: [cluster_hardening, cluster_setup]
      chapters: ["10", "04"]
      location: "course/10/ru.md"
      summary: "RBAC default-deny uses the same allow-list logic as NetworkPolicy default-deny."
    - id: fb_11_21
      kind: flashback_question
      domains: [cluster_hardening, minimize_microservice_vulnerabilities]
      chapters: ["11", "21"]
      location: "course/11/ru.md"
      summary: "ServiceAccount token as a Secret: how the threat from a token differs from the threat from an ordinary Secret."
    - id: fb_12_32
      kind: flashback_question
      domains: [cluster_hardening, monitoring_logging_runtime_security]
      chapters: ["12", "32"]
      location: "course/12/ru.md"
      summary: "A targeted curl/401 check vs an audit log as request-level evidence (not a continuous config-state monitor)."
    - id: fb_13_26
      kind: flashback_question
      domains: [cluster_hardening, supply_chain_security]
      chapters: ["13", "26"]
      location: "course/13/ru.md"
      summary: "Version skew (compatible) vs image digest pinning (identical)—two ways to trust a version."
    - id: fb_14_29
      kind: flashback_question
      domains: [system_hardening, monitoring_logging_runtime_security]
      chapters: ["14", "29"]
      location: "course/14/ru.md"
      summary: "Static host hardening vs Falco runtime detection of a new process."
    - id: fb_15_10
      kind: flashback_question
      domains: [system_hardening, cluster_hardening]
      chapters: ["15", "10"]
      location: "course/15/ru.md"
      summary: "Two levels of least privilege: Linux host and Kubernetes API (RBAC)."
    - id: fb_16_18
      kind: flashback_question
      domains: [system_hardening, minimize_microservice_vulnerabilities]
      chapters: ["16", "18"]
      location: "course/16/ru.md"
      summary: "Where AppArmor ends and the PSA zone begins."
    - id: fb_17_20
      kind: flashback_question
      domains: [system_hardening, minimize_microservice_vulnerabilities]
      chapters: ["17", "20"]
      location: "course/17/ru.md"
      summary: "Why an admission policy does not guarantee seccomp enforcement without node support."
    - id: fb_18_10
      kind: flashback_question
      domains: [minimize_microservice_vulnerabilities, cluster_hardening]
      chapters: ["18", "10"]
      location: "course/18/ru.md"
      summary: "Bypassing PSA through RBAC permission to create namespaces without constrained labels."
    - id: fb_19_30
      kind: flashback_question
      domains: [minimize_microservice_vulnerabilities, monitoring_logging_runtime_security]
      chapters: ["19", "30"]
      location: "course/19/ru.md"
      summary: "PSA does not stop runtime threats after successful admission."
    - id: fb_20_04
      kind: flashback_question
      domains: [minimize_microservice_vulnerabilities, cluster_setup]
      chapters: ["20", "04"]
      location: "course/20/ru.md"
      summary: "Admission policy enforce/Deny and NetworkPolicy default-deny use the same allow-list logic."
    - id: fb_21_14
      kind: flashback_question
      domains: [minimize_microservice_vulnerabilities, system_hardening]
