foundation:
  # Главы 01-03 - словарь модели угроз и Linux-механизмы, не привязаны к одному домену
  # с весом на экзамене, но являются prerequisite для всех доменов выше.
  chapters: ["01", "02", "03"]
  relevance: core
  note: >
    Глава 01 - формат экзамена и exam snapshot. Глава 02 - threat model/OWASP Kubernetes
    Top 10 2025, также используется в attack_phase_investigation (monitoring domain).
    Глава 03 - Linux-изоляция (namespaces, cgroups, capabilities, User Namespaces),
    prerequisite для apparmor/seccomp (system_hardening) и sandboxed containers
    (minimize_microservice_vulnerabilities).

tactics:
  # Глава 33 - тактика экзамена, разрешённая документация, финальный чеклист.
  chapters: ["33"]
  relevance: core

coverage_gaps:
  # Известные несоответствия между официальной 6-доменной моделью и curriculum-map:
  # заполняется вручную при аудите, не является автоматическим выводом.
  - id: no_lab_for_rbac_upgrade
    domain: cluster_hardening
    competency: upgrade_kubernetes
    note: "Компетенция upgrade_kubernetes (глава 13) не имеет отдельной лабы; проверяется частично моками."
  - id: no_mock_coverage_several_competencies
    note: >
      Несколько core-компетенций (ingress_tls, node_metadata_endpoints, verify_platform_binaries,
      restrict_api_access, upgrade_kubernetes, admission_policies, isolation_multitenancy,
      pod_to_pod_encryption, все Supply Chain и все Runtime competencies) не имеют явного
      mock-покрытия в этой карте. Это может отражать реальное покрытие моков 01-04 (нужна
      отдельная проверка содержания каждого mock) либо пробел, который стоит устранить.
