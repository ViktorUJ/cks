schema_version: 1
checked_at: "2026-09-06"

# Источник структуры: tasks/cks/course/CKS_RU.md ("Домены CKS и главы",
# "Компетенция → глава", "Домен → лабы"). Обновляйте эту карту вручную при изменении
# CKS_RU.md - файл не генерируется автоматически.
#
# relevance: core - прямо требуется curriculum и должен уметь кандидат;
#            deep_dive - помогает решать/troubleshoot CKS, выходит за формальный minimum;
#            production - выходит за экзамен, но усиливает инженера.

# weight_sources: два официальных публичных источника весов CKS расходятся между собой на
# дату проверки (проверено вручную 2026-09-06). Поле weight: у каждого домена ниже
# использует linux_foundation_product_page (candidate-facing страница регистрации на
# экзамен) как operational source, но расхождение с cncf_certification_page сохранено
# здесь явно, а не скрыто - целостность обучения не должна автоматически подстраиваться
# под один источник без учёта другого.
weight_sources:
  linux_foundation_product_page:
    url: "https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist/"
    checked_at: "2026-09-06"
    weights:
      cluster_setup: 15
      cluster_hardening: 15
      system_hardening: 10
      minimize_microservice_vulnerabilities: 20
      supply_chain_security: 20
      monitoring_logging_runtime_security: 20
  cncf_certification_page:
    url: "https://www.cncf.io/training/certification/cks/"
    checked_at: "2026-09-06"
    weights:
      cluster_setup: 10
      cluster_hardening: 15
      system_hardening: 15
      minimize_microservice_vulnerabilities: 20
      supply_chain_security: 20
      monitoring_logging_runtime_security: 20
  agreement_status: disagreement
  note: >
    LF и CNCF расходятся именно по Cluster Setup (15% vs 10%) и System Hardening
    (10% vs 15%); Cluster Hardening, Microservice, Supply Chain и Runtime совпадают
    у обоих источников. Каждый domain-раздел ниже использует LF-вес как operational
    default (кандидаты регистрируются через LF), но при планировании времени на
    экзамене стоит учитывать оба варианта, особенно для Cluster Setup/System Hardening.

domains:

  cluster_setup:
    weight: 15
    weight_source: linux_foundation_product_page
    chapters: ["04", "05", "06", "07", "08", "09"]
    competencies:
      network_policy:
        relevance: core
        theory: ["course/04/ru.md", "course/05/ru.md", "course/06/ru.md"]
        labs: ["labs/101", "labs/102"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]
      cis_benchmark:
        relevance: core
        theory: ["course/07/ru.md"]
        labs: ["labs/103"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]
      ingress_tls:
        relevance: core
        theory: ["course/08/ru.md"]
        labs: ["labs/103"]
        mocks: ["mock/02", "mock/03", "mock/04"]
      node_metadata_endpoints:
        relevance: core
        theory: ["course/05/ru.md", "course/09/ru.md"]
        labs: ["labs/101"]
        mocks: []
      verify_platform_binaries:
        relevance: core
        theory: ["course/09/ru.md"]
        labs: ["labs/103"]
        mocks: []
      gui_dashboard_access:
        relevance: legacy_deep_dive
        current_lf_product_page: false
        historical_curriculum: true
        theory: ["course/05/ru.md#05.4"]
        labs: []
        mocks: []
        note: >
          Официальный пункт "Minimize use of, and access to, GUI elements" присутствовал в
          более ранних версиях curriculum, но текущая Linux Foundation product page (проверено
          2026-09-06) не перечисляет отдельную GUI/Dashboard competency в Cluster Setup.
          upstream Kubernetes Dashboard архивирован и не является приоритетом текущего CKS.
          relevance помечена legacy_deep_dive (не core), чтобы не создавать противоречие
          "core, но не приоритет" - покрытие сознательно ограничено принципом
          least-privilege для любого web UI поверх API (RBAC read-only role, private
          exposure), без отдельной лабы.

  cluster_hardening:
    weight: 15
    weight_source: linux_foundation_product_page
    chapters: ["10", "11", "12", "13"]
    competencies:
      rbac:
        relevance: core
        theory: ["course/10/ru.md"]
        labs: ["labs/104"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]
      service_accounts:
        relevance: core
        theory: ["course/11/ru.md"]
        labs: ["labs/104"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]
      restrict_api_access:
        relevance: core
        theory: ["course/12/ru.md", "course/09/ru.md"]
        labs: ["labs/104"]
        mocks: ["mock/04"]
      upgrade_kubernetes:
        relevance: core
        theory: ["course/13/ru.md"]
