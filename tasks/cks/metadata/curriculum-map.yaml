      location: "course/17/ru.md"
      cross_domain_task_refs: ["10", "16", "17"]
    - id: cp_minimize_microservice_vulnerabilities
      kind: mixed_checkpoint
      domain: minimize_microservice_vulnerabilities
      chapters: ["18", "19", "20", "21", "22", "23"]
      location: "course/23/ru.md"
      cross_domain_task_refs: ["10", "18", "19", "04"]
    - id: cp_supply_chain_security
      kind: mixed_checkpoint
      domain: supply_chain_security
      chapters: ["24", "25", "26", "27", "28"]
      location: "course/28/ru.md"
      cross_domain_task_refs: ["20", "26"]
    - id: cp_monitoring_logging_runtime_security
      kind: mixed_checkpoint
      domain: monitoring_logging_runtime_security
      chapters: ["29", "30", "31", "32"]
      location: "course/32/ru.md"
      cross_domain_task_refs: ["12", "10", "30", "31", "32"]
      note: >
        The course's final checkpoint contains a "Final integration task" that combines
        three domains in one chain: RBAC privilege escalation (cluster_hardening) → audit log
        detection (monitoring) → containment.
  integration_tasks:
    # Tasks within existing labs that require a technique from another domain to complete
    # (a compromise between full new integration labs and a targeted edit).
    - id: it_lab104_task9
      kind: integration_task
      domains: [cluster_hardening, monitoring_logging_runtime_security]
      location: "labs/104/README_RU.MD#9"
      summary: >
        RBAC privilege escalation (ClusterRoleBinding to cluster-admin) is detected through
        a targeted audit policy for rbac.authorization.k8s.io and contained by removing the
        binding with confirmed access revocation.
    - id: it_lab112_task9
      kind: integration_task
      domains: [supply_chain_security, monitoring_logging_runtime_security]
      location: "labs/112/README_RU.MD#9"
      summary: >
        Kyverno ValidatingPolicy blocks an untrusted registry image at admission (Supply
        Chain); a Falco custom rule on container.image.repository detects an attempt to
        bypass this policy by starting a container directly in containerd (ctr), bypassing
        kube-apiserver and the admission controller entirely.
