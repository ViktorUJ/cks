    - id: fb_24_14
      kind: flashback_question
      domains: [supply_chain_security, system_hardening]
      chapters: ["24", "14"]
      location: "course/24/ru.md"
      summary: "Attack-surface minimization at two levels: base image and host footprint."
    - id: fb_25_32
      kind: flashback_question
      domains: [supply_chain_security, monitoring_logging_runtime_security]
      chapters: ["25", "32"]
      location: "course/25/ru.md"
      summary: "SBOM/provenance ('what it was built from') vs audit log ('who interacted and when')."
    - id: fb_26_20
      kind: flashback_question
