schema_version: 1
checked_at: "2026-09-06"

# Источник структуры: tasks/cks/course/CKS_RU.md ("Домены CKS и главы",
# "Компетенция → глава", "Домен → лабы"). Обновляйте эту карту вручную при изменении
# CKS_RU.md - файл не генерируется автоматически.
#
# relevance: core - прямо требуется curriculum и должен уметь кандидат;
#            deep_dive - помогает решать/troubleshoot CKS, выходит за формальный minimum;
#            production - выходит за экзамен, но усиливает инженера.

