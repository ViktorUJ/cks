schema_version: 1
checked_at: "2026-09-06"

# Structural source: tasks/cks/course/README_RU.md ("Domains and chapters",
# "Competency → chapter", "Domain → labs" sections). Update this map manually when
# README_RU.md changes—the file is not generated automatically.
#
# relevance: core - explicitly required by the curriculum and must be mastered by the candidate;
#            deep_dive - helps solve/troubleshoot CKS tasks and exceeds the formal minimum;
#            production - exceeds the exam scope but strengthens the engineer.

# weight_sources: two official public sources for CKS weights disagree as of the
# verification date (manually checked 2026-09-06). The weight: field for every domain below
# uses linux_foundation_product_page (the candidate-facing registration page for the
# exam) as its operational source, but the disagreement with cncf_certification_page is
# recorded explicitly here rather than hidden—the integrity of the training must not
# automatically adapt to one source without considering the other.
weight_sources:
  linux_foundation_product_page:
    url: "https://training.linuxfoundation.org/certification/certified-kubernetes-security-specialist/"
    checked_at: "2026-09-06"
    weights:
      cluster_setup: 15
      cluster_hardening: 15
      system_hardening: 10
      minimize_microservice_vulnerabilities: 20
      supply_chain_security: 20
      monitoring_logging_runtime_security: 20
  cncf_certification_page:
    url: "https://www.cncf.io/training/certification/cks/"
    checked_at: "2026-09-06"
    weights:
      cluster_setup: 10
      cluster_hardening: 15
      system_hardening: 15
      minimize_microservice_vulnerabilities: 20
      supply_chain_security: 20
      monitoring_logging_runtime_security: 20
  agreement_status: disagreement
  note: >
    LF and CNCF differ specifically on Cluster Setup (15% vs 10%) and System Hardening
    (10% vs 15%); Cluster Hardening, Microservice, Supply Chain, and Runtime agree
    in both sources. Each domain section below uses the LF weight as the operational
    default (candidates register through LF), but both variants should be considered
    when planning exam time, especially for Cluster Setup/System Hardening.

domains:

  cluster_setup:
    weight: 15
    weight_source: linux_foundation_product_page
    chapters: ["04", "05", "06", "07", "08", "09"]
    competencies:
      network_policy:
        relevance: core
        theory: ["course/04/ru.md", "course/05/ru.md", "course/06/ru.md"]
        labs: ["labs/101", "labs/102"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]
      cis_benchmark:
        relevance: core
        theory: ["course/07/ru.md"]
        labs: ["labs/103"]
        mocks: ["mock/01", "mock/02", "mock/03", "mock/04"]
      ingress_tls:
        relevance: core
        theory: ["course/08/ru.md"]
        labs: ["labs/103"]
        mocks: ["mock/02", "mock/03", "mock/04"]
      node_metadata_endpoints:
        relevance: core
        theory: ["course/05/ru.md", "course/09/ru.md"]
        labs: ["labs/101"]
        mocks: []
      verify_platform_binaries:
        relevance: core
        theory: ["course/09/ru.md"]
        labs: ["labs/103"]
        mocks: []
      gui_dashboard_access:
        relevance: legacy_deep_dive
        current_lf_product_page: false
        historical_curriculum: true
        theory: ["course/05/ru.md#05.4"]
        labs: []
        mocks: []
        note: >
          The official item "Minimize use of, and access to, GUI elements" appeared in
          earlier versions of the curriculum, but the current Linux Foundation product page (checked
          2026-09-06) does not list a separate GUI/Dashboard competency in Cluster Setup.
          Upstream Kubernetes Dashboard has been archived and is not a current CKS priority.
          relevance is marked legacy_deep_dive (not core) to avoid the contradiction of
          "core, but not a priority"—coverage is deliberately limited to the
          least-privilege principle for any web UI over the API (RBAC read-only role, private
          exposure), without a separate lab.

  cluster_hardening:
