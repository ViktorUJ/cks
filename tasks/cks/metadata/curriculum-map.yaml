    - id: fb_32_12
      kind: flashback_question
      domains: [monitoring_logging_runtime_security, cluster_hardening]
      chapters: ["32", "12"]
      location: "course/32/ru.md"
      summary: "An audit log provides request-level evidence (who/when/verb/result), not a continuous config-state monitor for restriction."
  checkpoints:
    - id: cp_cluster_setup
      kind: mixed_checkpoint
      domain: cluster_setup
      chapters: ["04", "05", "06", "07", "08", "09"]
      location: "course/09/ru.md"
      cross_domain_task_refs: ["04", "08"]
    - id: cp_cluster_hardening
      kind: mixed_checkpoint
      domain: cluster_hardening
      chapters: ["10", "11", "12", "13"]
      location: "course/13/ru.md"
