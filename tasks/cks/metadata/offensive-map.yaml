schema_version: 1
checked_at: "2026-09-06"

# Map of existing "Adversary Lens" blocks in course chapters.
# Rule: an ATT&CK ID is specified only where the mapping is actually present in the chapter text
# and meaningful; do not attach a technique ID decoratively just to populate the field.
# Update this map manually when adding new Adversary Lens blocks.

adversary_lens_blocks:

  - chapter: "course/04/ru.md"
    title: "NetworkPolicy: lateral movement after Pod compromise"
    asset: "backend Service and internal APIs"
    starting_foothold: "RCE in frontend Pod"
    attacker_objective: "discover internal endpoints and reach the backend"
    control: "default-deny ingress/egress + explicit identity/label/port rules"
    evidence: ["cni_flow_logs", "hubble_flows", "dns_queries"]
    attck: []
    attck_note: "Mapping is not specified in the chapter text; the technique is close to T1046 (Network Service Discovery), but is not cited as such - not added here to avoid attaching a decorative ID."

  - chapter: "course/05/ru.md"
    title: "kubelet: monitoring credential → kubelet blast radius"
    asset: "kubelet API and containers on the node"
    starting_foothold: "compromised monitoring agent"
    attacker_objective: "turn read-only nodes/proxy access into container control"
    control: "replace broad nodes/proxy with precise nodes/metrics, nodes/stats"
    evidence: ["subject_access_review", "kubernetes_audit", "kubelet_access_telemetry"]
    attck:
      - id: T1609
        name: "Container Administration Command"
        url: "https://attack.mitre.org/techniques/T1609/"
      - id: T1613
        name: "Container and Resource Discovery"
        url: "https://attack.mitre.org/techniques/T1613/"

  - chapter: "course/10/ru.md"
    title: "RBAC/ServiceAccount: compromised Pod → API blast radius"
    asset: "Kubernetes API resources"
    starting_foothold: "code execution inside Pod"
    attacker_objective: "use workload identity to access the API"
    control: "automountServiceAccountToken: false / projected short-lived token / minimal RBAC"
    evidence: ["kubernetes_audit", "subject_access_review"]
    attck:
      - id: T1528
        name: "Steal Application Access Token"
        url: "https://attack.mitre.org/techniques/T1528/"

  - chapter: "course/16/ru.md"
    title: "AppArmor: profile bypass"
    asset: "host filesystem and syscalls accessible to the container"
    starting_foothold: "RCE in the container"
    attacker_objective: "perform an action outside the profile (protected path/prohibited syscall)"
    control: "verified enforced profile + verification via aa-status"
    evidence: ["aa_status", "dmesg_denial", "journalctl_k_denial"]
    attck: []
    attck_note: "Mapping is not specified in the chapter text; the technique is close to T1611 (Escape to Host), but a profile bypass by itself does not guarantee host escape - not added here without a direct citation from the chapter."

  - chapter: "course/24/ru.md"
    title: "Image minimization: build-time secret leakage"
    asset: "secrets/credentials in build-time files (.npmrc, token)"
    starting_foothold: "access to the Dockerfile/build context or the ability to inspect the image"
    attacker_objective: "find a credential left in intermediate image layers"
    control: "BuildKit --mount=type=secret + .dockerignore + multi-stage without a secret in the final layer"
    evidence: ["docker_history", "trivy_image_scan"]
    attck: []
    attck_note: "Mapping is not specified in the chapter text; the technique is close to T1552.001 (Credentials In Files), but is not cited - not added here decoratively."

  - chapter: "course/26/ru.md"
    title: "Supply chain: mutable-tag tampering"
    asset: "production workload image reference"
    starting_foothold: "push to the registry or compromised CI"
    attacker_objective: "bypass registry allowlist/admission by retargeting a mutable tag without changing the digest"
    control: "digest pinning + registry allowlist + admission signature verification (ImagePolicyWebhook/Kyverno)"
    evidence: ["admission_denial_event", "audit_log_unapproved_registry_or_invalid_signature"]
    attck: []
    attck_note: "Mapping is not specified in the chapter text; the technique is close to T1195.002 (Compromise Software Supply Chain), but is not cited - not added here decoratively."

  - chapter: "course/29/ru.md"
    title: "Falco: runtime detection bypass"
    asset: "runtime anomaly visibility for the security team"
    starting_foothold: "RCE in a container with the ability to choose the action to execute"
    attacker_objective: "perform a suspicious action without triggering an alert"
    control: "correct driver-specific unit enabled and active + tuned rules without excessive false-positive suppression"
    evidence: ["falco_alert_with_container_process_context"]
    attck: []
    attck_note: "Mapping is not specified in the chapter text; the technique depends on the specific abuse action (write/network) and does not reduce to one ID - not added here decoratively."

  - chapter: "course/32/ru.md"
    title: "Audit: evasion through WebSocket kubectl exec"
    asset: "forensic history of the attacker's API actions"
    starting_foothold: "access to the API through a compromised credential/token"
    attacker_objective: "execute kubectl exec so that the detection rule does not recognize it as successful"
    control: "detection rule accounts for verb get/create, streaming stages, code 101"
    evidence: ["audit_log_with_correct_verb_and_stage"]
    attck:
      - id: T1609
        name: "Container Administration Command"
        url: "https://attack.mitre.org/techniques/T1609/"

# Reverse technique-to-chapter map, for cases where all chapters need to be found
# that affect a specific ATT&CK technique.
techniques_index:
  T1528:
    name: "Steal Application Access Token"
    chapters: ["course/10/ru.md"]
  T1609:
    name: "Container Administration Command"
    chapters: ["course/05/ru.md", "course/32/ru.md"]
  T1613:
    name: "Container and Resource Discovery"
    chapters: ["course/05/ru.md"]

coverage_note: >
  8 of the 10 target chapters proposed by the report (04, 05, 10, 16, 24, 26, 29, 32) now
  have an Adversary Lens block. Only 3 blocks (05, 10, 32) contain an explicit ATT&CK mapping,
  because the other five topics have no unambiguous 1:1 mapping to a specific technique
  without the risk of decorative tagging - see attck_note in each entry above.
